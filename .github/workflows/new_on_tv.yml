# .github/workflows/new_on_tv.yml
# Save to: C:\MarvelApps\marvelmagic\.github\workflows\new_on_tv.yml
# Rebuilds new_on_tv.json (Marvel Magic's premieres + new seasons, next 3 weeks) twice a day. The Hubs' "New on TV - from Marvel
# Magic" card reads this file (Scott 11/14: shows plugged in any of our apps come from Marvel Magic). Listings: TVmaze (CC BY-SA).
name: new on tv
on:
  schedule:
    - cron: "41 9,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_new_on_tv.py new_on_tv.json
      - run: |
          git config user.name "marvel-magic-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add new_on_tv.json
          git diff --cached --quiet || (git commit -m "new on tv refresh" && git pull --rebase && git push)
